media:
  input: assets
  output: /assets

content:
  - name: webpage
    label: 网页数据管理
    type: file
    path: data.json  # 关键！后台现在只改这个文件
    fields:
      - name: themeColor
        label: 全局主题色（默认002FA7）
        type: string
      - name: coverSub
        label: 封面副标题
        type: string
      - name: coverRightText
        label: 右上角文字（休恋逝水）
        type: string
      - name: coverRightSub
        label: 右上角问句（不含问号）
        type: string
      - name: soundPoem
        label: 音乐页三句诗（换行）
        type: text
      - name: profileName
        label: 档案名字
        type: string
      - name: profileRole
        label: 职业/英文署名
        type: string
      - name: profileAge
        label: 年龄
        type: string
      - name: profileSign
        label: 星座
        type: string
      - name: profileMbti
        label: MBTI
        type: string
      - name: profileIp
        label: IP地址
        type: string
      - name: profileStatus
        label: 状态（性格）
        type: string
      - name: diaries
        label: 留言日记列表
        type: object
        list: true
        fields:
          - name: date
            label: 日期
            type: string
          - name: content
            label: 内容
            type: text
      - name: businesses
        label: 业务大类列表
        type: object
        list: true
        fields:
          - name: title
            label: 大类名称（如：陪玩）
            type: string
          - name: desc
            label: 大类描述
            type: string
          - name: items
            label: 子分类列表
            type: object
            list: true
            fields:
              - name: name
                label: 子分类名
                type: string
              - name: desc
                label: 子分类简介（12字内）
                type: string
              - name: link
                label: 作品链接（选填）
                type: string
      - name: notices
        label: 须知大类列表
        type: object
        list: true
        fields:
          - name: title
            label: 大类名称
            type: string
          - name: subTitle
            label: 大类描述
            type: string
          - name: tabs
            label: 具体分类
            type: object
            list: true
            fields:
              - name: tabName
                label: 标签名（2字内）
                type: string
              - name: rules
                label: 规则列表
                type: object
                list: true
                fields:
                  - name: title
                    label: 标题
                    type: string
                  - name: desc
                    label: 详情
                    type: text
      - name: guanzhiText
        label: 观止文字（只能2字）
        type: string
      - name: contactTime
        label: 在线时间
        type: string
      - name: qrImage
        label: 收款码图片
        type: image
