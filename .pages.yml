media:
  input: assets
  output: /assets

content:
  - name: webpage
    label: 网页所有内容
    type: file
    path: index.html
    fields:
      # 封面页
      - name: coverMotto
        label: 封面中间文字(休恋逝水)
        type: string
      - name: coverSub
        label: 封面左下文字(我何去何从)
        type: string
      # 音乐页
      - name: musicText
        label: 音乐页三句文案
        type: text
      # 自我介绍页
      - name: authorEn
        label: 英文署名(LIN YI)
        type: string
      - name: authorJob
        label: 职业(独立创作者)
        type: string
      - name: authorCn
        label: 中文名字(林壹)
        type: string
      - name: age
        label: 年龄
        type: string
      - name: sign
        label: 星座
        type: string
      - name: mbti
        label: MBTI
        type: string
      - name: location
        label: 所在地
        type: string
      - name: status
        label: 性格标签
        type: string
      # 联系与支付
      - name: guanzhi
        label: 观止二字
        type: string
      - name: qrImage
        label: 底部二维码
        type: image
      - name: workTime
        label: 在线时间
        type: string
      # 日记列表（可无限添加，前端会限制100）
      - name: diaries
        label: 日记列表(可增删)
        type: object
        list: true
        fields:
          - name: date
            label: 日期
            type: string
          - name: content
            label: 内容
            type: text
      # 业务列表（可增删）
      - name: services
        label: 业务目录(可增删)
        type: object
        list: true
        fields:
          - name: name
            label: 业务名称(如陪玩)
            type: string
          - name: desc
            label: 对应标签(如情绪/倾诉)
            type: string
